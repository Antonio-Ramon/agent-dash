[package]
name = "agent-dash"
version = "0.2.2"
edition = "2024"
description = "Dashboard TUI (estilo lazygit) para monitorar sessões, agentes, shells e consumo de tokens do Claude Code"

[dependencies]
anyhow = "1.0.104"
chrono = "=0.4.39"
dirs = "5"
portable-pty = "0.8"
ratatui = "0.29"
tui-term = "0.2"
vt100 = "0.15"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.33"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
